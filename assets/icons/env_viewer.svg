<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- App icon for env_viewer (测试环境 dashboard).
       Motif: a console tile holding a 3×3 grid of environment status tiles —
       the environment roster at a glance. Canvas follows the macOS Big Sur
       convention: 1024 canvas, 824 squircle centered with ~185 corner radius. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22334f"/>
      <stop offset="1" stop-color="#0f1a2c"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#527099"/>
      <stop offset="1" stop-color="#3c557e"/>
    </linearGradient>
    <linearGradient id="ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#22b365"/>
    </linearGradient>
    <linearGradient id="warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#e08e0b"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#drop)"/>
  <!-- top sheen so the slab doesn't read flat -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none"
        stroke="#8fb2e6" stroke-opacity="0.22" stroke-width="6"/>

  <!-- 3×3 environment tiles: 176px tiles, 40px gaps, centered in the squircle -->
  <g>
    <rect x="208" y="208" width="176" height="176" rx="44" fill="url(#tile)"/>
    <rect x="424" y="208" width="176" height="176" rx="44" fill="url(#ok)"/>
    <rect x="640" y="208" width="176" height="176" rx="44" fill="url(#tile)"/>

    <rect x="208" y="424" width="176" height="176" rx="44" fill="url(#tile)"/>
    <rect x="424" y="424" width="176" height="176" rx="44" fill="url(#tile)"/>
    <rect x="640" y="424" width="176" height="176" rx="44" fill="url(#warn)"/>

    <rect x="208" y="640" width="176" height="176" rx="44" fill="url(#ok)"/>
    <rect x="424" y="640" width="176" height="176" rx="44" fill="url(#tile)"/>
    <rect x="640" y="640" width="176" height="176" rx="44" fill="url(#tile)"/>
  </g>
</svg>
