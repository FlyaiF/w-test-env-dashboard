name: test_env_dashboard
description: "测试环境速查工具"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dartssh2: ^2.9.0
  http: ^1.3.0
  provider: ^6.1.0
  data_table_2: ^2.5.0
  window_manager: ^0.4.0
  url_launcher: ^6.3.0
  path_provider: ^2.1.0
  intl: ^0.20.0
  rust_lib_test_env_dashboard:
    path: rust_builder
  flutter_rust_bridge: 2.12.0
  file_picker: ^10.3.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.30.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: Sarasa Gothic SC
      fonts:
        - asset: assets/fonts/SarasaGothicSC-Regular.ttf
        - asset: assets/fonts/SarasaGothicSC-Bold.ttf
          weight: 700
    - family: Sarasa Mono SC
      fonts:
        - asset: assets/fonts/SarasaMonoSC-Regular.ttf
        - asset: assets/fonts/SarasaMonoSC-Bold.ttf
          weight: 700
