# Test datasource: H2 in Oracle compatibility mode, mirroring local dev so Flyway
# migrations and JPA mappings are exercised against the same dialect surface.
spring:
  datasource:
    url: jdbc:h2:mem:envdashboard-test;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

# Tests drive Collection explicitly; the background scheduler stays off so it never races a test.
envdashboard:
  collection:
    scheduler-enabled: false
  # Fixed passphrase so secret encryption (ADR-0005) is exercised deterministically under test.
  access:
    secret-key: test-secret-key
