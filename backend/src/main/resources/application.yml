# Shared configuration. Profile-specific datasource lives in application-<profile>.yml.
spring:
  application:
    name: env-dashboard-backend
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; never let Hibernate touch DDL.
      ddl-auto: none

# Version Collection (slice 05): the scheduled sweep cadence and on/off switch. Interval and delays
# are ISO-8601 durations. Disabled in the local/test profiles (they drive Collection manually).
envdashboard:
  collection:
    scheduler-enabled: true
    interval: PT5M
    initial-delay: PT30S

# Liveness/readiness for the walking-skeleton health-check AC.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
