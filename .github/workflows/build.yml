name: Build Desktop App

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        profile:
          - name: env_viewer
            desc: Environment viewer
          - name: zipr_tool
            desc: Archive comparison tool
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: true
          token: ${{ secrets.PAT || github.token }}

      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache-dependency-path: go_sidecar/go.sum

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            zipr/target
          key: macos-cargo-${{ hashFiles('zipr/Cargo.lock') }}
          restore-keys: macos-cargo-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.6'

      - name: Compute build metadata
        id: meta
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"

      - name: Build Go sidecar (universal binary)
        working-directory: go_sidecar
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
          BUILD_TIME: ${{ steps.meta.outputs.build_time }}
        run: |
          PKG=test-env-dashboard/go_sidecar/buildinfo
          LDFLAGS="-s -w -X $PKG.Version=$VERSION -X $PKG.Commit=$COMMIT -X $PKG.BuildTime=$BUILD_TIME"
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="$LDFLAGS" -o go_sidecar_arm64 .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="$LDFLAGS" -o go_sidecar_amd64 .
          lipo -create -output go_sidecar go_sidecar_arm64 go_sidecar_amd64
          file go_sidecar

      - name: Build zipr CLI (universal binary)
        working-directory: zipr
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output zipr \
            target/aarch64-apple-darwin/release/zipr \
            target/x86_64-apple-darwin/release/zipr
          file zipr

      - name: Build Flutter macOS app
        working-directory: flutter_app
        env:
          COMMIT: ${{ steps.meta.outputs.commit }}
          BUILD_TIME: ${{ steps.meta.outputs.build_time }}
        run: |
          flutter pub get
          flutter build macos --release \
            --dart-define=COMMIT="$COMMIT" \
            --dart-define=BUILD_TIME="$BUILD_TIME"

      - name: Bundle sidecar, zipr and package as ${{ matrix.profile.name }}
        run: |
          SRC_APP="flutter_app/build/macos/Build/Products/Release/test_env_dashboard.app"
          PROFILE="${{ matrix.profile.name }}"
          DEST_APP="flutter_app/build/macos/Build/Products/Release/${PROFILE}.app"

          # Rename .app bundle so FeatureProfile resolves the correct profile
          cp -R "$SRC_APP" "$DEST_APP"

          cp go_sidecar/go_sidecar "$DEST_APP/Contents/Resources/go_sidecar"
          chmod +x "$DEST_APP/Contents/Resources/go_sidecar"
          cp zipr/zipr "$DEST_APP/Contents/Resources/zipr"
          chmod +x "$DEST_APP/Contents/Resources/zipr"

          cd flutter_app/build/macos/Build/Products/Release
          zip -r -y "${PROFILE}-macos.zip" "${PROFILE}.app"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.profile.name }}-macos
          path: flutter_app/build/macos/Build/Products/Release/${{ matrix.profile.name }}-macos.zip

  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        profile:
          - name: env_viewer
            desc: Environment viewer
          - name: zipr_tool
            desc: Archive comparison tool
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: true
          token: ${{ secrets.PAT || github.token }}

      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache-dependency-path: go_sidecar/go.sum

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            zipr/target
          key: windows-cargo-${{ hashFiles('zipr/Cargo.lock') }}
          restore-keys: windows-cargo-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.6'

      - name: Compute build metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"

      - name: Build Go sidecar
        working-directory: go_sidecar
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
          BUILD_TIME: ${{ steps.meta.outputs.build_time }}
        run: |
          PKG=test-env-dashboard/go_sidecar/buildinfo
          LDFLAGS="-s -w -X $PKG.Version=$VERSION -X $PKG.Commit=$COMMIT -X $PKG.BuildTime=$BUILD_TIME"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o go_sidecar.exe .

      - name: Build zipr CLI
        working-directory: zipr
        run: cargo build --release

      - name: Build Flutter Windows app
        working-directory: flutter_app
        shell: bash
        env:
          COMMIT: ${{ steps.meta.outputs.commit }}
          BUILD_TIME: ${{ steps.meta.outputs.build_time }}
        run: |
          flutter pub get
          flutter build windows --release \
            --dart-define=COMMIT="$COMMIT" \
            --dart-define=BUILD_TIME="$BUILD_TIME"

      - name: Bundle sidecar, zipr and package as ${{ matrix.profile.name }}
        shell: bash
        run: |
          RELEASE_DIR="flutter_app/build/windows/x64/runner/Release"
          PROFILE="${{ matrix.profile.name }}"

          mkdir -p "$RELEASE_DIR/data"
          cp go_sidecar/go_sidecar.exe "$RELEASE_DIR/data/go_sidecar.exe"
          cp zipr/target/release/zipr.exe "$RELEASE_DIR/data/zipr.exe"

          # Rename executable so FeatureProfile resolves the correct profile
          mv "$RELEASE_DIR/test_env_dashboard.exe" "$RELEASE_DIR/${PROFILE}.exe"

          cd "$RELEASE_DIR"
          7z a -tzip "../${PROFILE}-windows.zip" ./*

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.profile.name }}-windows
          path: flutter_app/build/windows/x64/runner/${{ matrix.profile.name }}-windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect zip files
        run: |
          mkdir -p release
          find artifacts -name "*.zip" -exec cp {} release/ \;
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release/*.zip
