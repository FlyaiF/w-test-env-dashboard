name: Build Desktop App

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: true
          token: ${{ secrets.PAT || github.token }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: go_sidecar/go.sum

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            zipr/target
          key: macos-cargo-${{ hashFiles('zipr/Cargo.lock') }}
          restore-keys: macos-cargo-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29.3'

      - name: Build Go sidecar (universal binary)
        working-directory: go_sidecar
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o go_sidecar_arm64 .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o go_sidecar_amd64 .
          lipo -create -output go_sidecar go_sidecar_arm64 go_sidecar_amd64
          file go_sidecar

      - name: Build zipr CLI (universal binary)
        working-directory: zipr
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output zipr \
            target/aarch64-apple-darwin/release/zipr \
            target/x86_64-apple-darwin/release/zipr
          file zipr

      - name: Build Flutter macOS app
        working-directory: flutter_app
        run: |
          flutter pub get
          flutter build macos --release

      - name: Bundle sidecar, zipr and package
        run: |
          APP="flutter_app/build/macos/Build/Products/Release/test_env_dashboard.app"
          cp go_sidecar/go_sidecar "$APP/Contents/Resources/go_sidecar"
          chmod +x "$APP/Contents/Resources/go_sidecar"
          cp zipr/zipr "$APP/Contents/Resources/zipr"
          chmod +x "$APP/Contents/Resources/zipr"
          cd flutter_app/build/macos/Build/Products/Release
          zip -r -y test-env-dashboard-macos.zip test_env_dashboard.app

      - uses: actions/upload-artifact@v4
        with:
          name: test-env-dashboard-macos
          path: flutter_app/build/macos/Build/Products/Release/test-env-dashboard-macos.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: true
          token: ${{ secrets.PAT || github.token }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: go_sidecar/go.sum

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            zipr/target
          key: windows-cargo-${{ hashFiles('zipr/Cargo.lock') }}
          restore-keys: windows-cargo-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29.3'

      - name: Build Go sidecar
        working-directory: go_sidecar
        shell: bash
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o go_sidecar.exe .

      - name: Build zipr CLI
        working-directory: zipr
        run: cargo build --release

      - name: Build Flutter Windows app
        working-directory: flutter_app
        run: |
          flutter pub get
          flutter build windows --release

      - name: Bundle sidecar, zipr and package
        shell: bash
        run: |
          RELEASE_DIR="flutter_app/build/windows/x64/runner/Release"
          mkdir -p "$RELEASE_DIR/data"
          cp go_sidecar/go_sidecar.exe "$RELEASE_DIR/data/go_sidecar.exe"
          cp zipr/target/release/zipr.exe "$RELEASE_DIR/data/zipr.exe"
          cd "$RELEASE_DIR"
          7z a -tzip ../test-env-dashboard-windows.zip ./*

      - uses: actions/upload-artifact@v4
        with:
          name: test-env-dashboard-windows
          path: flutter_app/build/windows/x64/runner/test-env-dashboard-windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect zip files
        run: |
          mkdir -p release
          find artifacts -name "*.zip" -exec cp {} release/ \;
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*.zip
