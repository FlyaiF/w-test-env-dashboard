name: Build Desktop App

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PUB_CACHE: ${{ github.workspace }}/.pub-cache

jobs:
  env-viewer-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: true
          token: ${{ secrets.PAT || github.token }}

      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache-dependency-path: go_sidecar/go.sum

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.6'
          cache: true

      - name: Cache Flutter pub packages
        uses: actions/cache@v5
        with:
          path: .pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('apps/**/pubspec.lock', 'packages/**/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-flutter-pub-

      - name: Compute build metadata
        id: meta
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"

      - name: Build Go sidecar (universal binary)
        working-directory: go_sidecar
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
          BUILD_TIME: ${{ steps.meta.outputs.build_time }}
        run: |
          PKG=test-env-dashboard/go_sidecar/buildinfo
          LDFLAGS="-s -w -X $PKG.Version=$VERSION -X $PKG.Commit=$COMMIT -X $PKG.BuildTime=$BUILD_TIME"
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="$LDFLAGS" -o go_sidecar_arm64 .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="$LDFLAGS" -o go_sidecar_amd64 .
          lipo -create -output go_sidecar go_sidecar_arm64 go_sidecar_amd64
          file go_sidecar

      - name: Build JDBC helper
        shell: bash
        run: |
          mvn -q dependency:get -Dartifact=com.oceanbase:oceanbase-client:2.4.7.1
          mkdir -p build/sidecar/jdbc/classes
          javac -source 8 -target 8 -d build/sidecar/jdbc/classes go_sidecar/jdbc_helper/RuntimeInfoHelper.java
          jar cf build/sidecar/jdbc/runtime-info-helper.jar -C build/sidecar/jdbc/classes RuntimeInfoHelper.class
          cp "$HOME/.m2/repository/com/oceanbase/oceanbase-client/2.4.7.1/oceanbase-client-2.4.7.1.jar" build/sidecar/jdbc/oceanbase-client.jar

      - name: Build env_viewer
        working-directory: apps/env_viewer
        env:
          COMMIT: ${{ steps.meta.outputs.commit }}
          BUILD_TIME: ${{ steps.meta.outputs.build_time }}
        run: |
          bash ../../scripts/sync_assets.sh
          flutter pub get
          flutter build macos --release \
            --dart-define=COMMIT="$COMMIT" \
            --dart-define=BUILD_TIME="$BUILD_TIME"

      - name: Bundle sidecar and package
        run: |
          RELEASE_DIR="apps/env_viewer/build/macos/Build/Products/Release"
          APP="$RELEASE_DIR/env_viewer.app"
          cp go_sidecar/go_sidecar "$APP/Contents/Resources/go_sidecar"
          chmod +x "$APP/Contents/Resources/go_sidecar"
          mkdir -p "$APP/Contents/Resources/jdbc"
          cp build/sidecar/jdbc/runtime-info-helper.jar "$APP/Contents/Resources/jdbc/"
          cp build/sidecar/jdbc/oceanbase-client.jar "$APP/Contents/Resources/jdbc/"
          (cd "$RELEASE_DIR" && zip -r -y "env_viewer-macos.zip" "env_viewer.app")

      - uses: actions/upload-artifact@v7
        with:
          name: env_viewer-macos
          path: apps/env_viewer/build/macos/Build/Products/Release/env_viewer-macos.zip

  zipr-tool-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: true
          token: ${{ secrets.PAT || github.token }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/zipr_tool/rust/target
            zipr/target
          key: macos-cargo-${{ hashFiles('zipr/Cargo.lock', 'apps/zipr_tool/rust/Cargo.lock') }}
          restore-keys: macos-cargo-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.6'
          cache: true

      - name: Cache Flutter pub packages
        uses: actions/cache@v5
        with:
          path: .pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('apps/**/pubspec.lock', 'packages/**/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-flutter-pub-

      - name: Compute build metadata
        id: meta
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"

      - name: Build zipr_tool
        working-directory: apps/zipr_tool
        env:
          COMMIT: ${{ steps.meta.outputs.commit }}
          BUILD_TIME: ${{ steps.meta.outputs.build_time }}
        run: |
          bash ../../scripts/sync_assets.sh
          flutter pub get
          flutter build macos --release \
            --dart-define=COMMIT="$COMMIT" \
            --dart-define=BUILD_TIME="$BUILD_TIME"

      - name: Package
        run: |
          RELEASE_DIR="apps/zipr_tool/build/macos/Build/Products/Release"
          (cd "$RELEASE_DIR" && zip -r -y "zipr_tool-macos.zip" "zipr_tool.app")

      - uses: actions/upload-artifact@v7
        with:
          name: zipr_tool-macos
          path: apps/zipr_tool/build/macos/Build/Products/Release/zipr_tool-macos.zip

  env-viewer-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: true
          token: ${{ secrets.PAT || github.token }}

      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache-dependency-path: go_sidecar/go.sum

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.6'
          cache: true

      - name: Cache Flutter pub packages
        uses: actions/cache@v5
        with:
          path: .pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('apps/**/pubspec.lock', 'packages/**/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-flutter-pub-

      - name: Compute build metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"

      - name: Build Go sidecar
        working-directory: go_sidecar
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
          BUILD_TIME: ${{ steps.meta.outputs.build_time }}
        run: |
          PKG=test-env-dashboard/go_sidecar/buildinfo
          LDFLAGS="-s -w -X $PKG.Version=$VERSION -X $PKG.Commit=$COMMIT -X $PKG.BuildTime=$BUILD_TIME"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o go_sidecar.exe .

      - name: Build JDBC helper
        shell: bash
        run: |
          mvn -q dependency:get -Dartifact=com.oceanbase:oceanbase-client:2.4.7.1
          mkdir -p build/sidecar/jdbc/classes
          javac -source 8 -target 8 -d build/sidecar/jdbc/classes go_sidecar/jdbc_helper/RuntimeInfoHelper.java
          jar cf build/sidecar/jdbc/runtime-info-helper.jar -C build/sidecar/jdbc/classes RuntimeInfoHelper.class
          cp "$HOME/.m2/repository/com/oceanbase/oceanbase-client/2.4.7.1/oceanbase-client-2.4.7.1.jar" build/sidecar/jdbc/oceanbase-client.jar

      - name: Build env_viewer
        working-directory: apps/env_viewer
        shell: bash
        env:
          COMMIT: ${{ steps.meta.outputs.commit }}
          BUILD_TIME: ${{ steps.meta.outputs.build_time }}
        run: |
          bash ../../scripts/sync_assets.sh
          flutter pub get
          flutter build windows --release \
            --dart-define=COMMIT="$COMMIT" \
            --dart-define=BUILD_TIME="$BUILD_TIME"

      - name: Bundle sidecar and package
        shell: bash
        run: |
          RELEASE_DIR="apps/env_viewer/build/windows/x64/runner/Release"
          mkdir -p "$RELEASE_DIR/data"
          cp go_sidecar/go_sidecar.exe "$RELEASE_DIR/data/go_sidecar.exe"
          mkdir -p "$RELEASE_DIR/data/jdbc"
          cp build/sidecar/jdbc/runtime-info-helper.jar "$RELEASE_DIR/data/jdbc/"
          cp build/sidecar/jdbc/oceanbase-client.jar "$RELEASE_DIR/data/jdbc/"
          (cd "$RELEASE_DIR" && 7z a -tzip "../env_viewer-windows.zip" ./*)

      - uses: actions/upload-artifact@v7
        with:
          name: env_viewer-windows
          path: apps/env_viewer/build/windows/x64/runner/env_viewer-windows.zip

  zipr-tool-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: true
          token: ${{ secrets.PAT || github.token }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/zipr_tool/rust/target
            zipr/target
          key: windows-cargo-${{ hashFiles('zipr/Cargo.lock', 'apps/zipr_tool/rust/Cargo.lock') }}
          restore-keys: windows-cargo-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.6'
          cache: true

      - name: Cache Flutter pub packages
        uses: actions/cache@v5
        with:
          path: .pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('apps/**/pubspec.lock', 'packages/**/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-flutter-pub-

      - name: Compute build metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"

      - name: Build zipr_tool
        working-directory: apps/zipr_tool
        shell: bash
        env:
          COMMIT: ${{ steps.meta.outputs.commit }}
          BUILD_TIME: ${{ steps.meta.outputs.build_time }}
        run: |
          bash ../../scripts/sync_assets.sh
          flutter pub get
          flutter build windows --release \
            --dart-define=COMMIT="$COMMIT" \
            --dart-define=BUILD_TIME="$BUILD_TIME"

      - name: Package
        shell: bash
        run: |
          RELEASE_DIR="apps/zipr_tool/build/windows/x64/runner/Release"
          (cd "$RELEASE_DIR" && 7z a -tzip "../zipr_tool-windows.zip" ./*)

      - uses: actions/upload-artifact@v7
        with:
          name: zipr_tool-windows
          path: apps/zipr_tool/build/windows/x64/runner/zipr_tool-windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [env-viewer-macos, zipr-tool-macos, env-viewer-windows, zipr-tool-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect zip files
        run: |
          mkdir -p release
          find artifacts -name "*.zip" -exec cp {} release/ \;
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release/*.zip
