name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PUB_CACHE: ${{ github.workspace }}/.pub-cache

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # CI build: unit/integration tests against H2 (Oracle mode).
      # The Oracle Testcontainers test is tagged "oracle-it" and excluded here;
      # run it on demand with -Dgroups=oracle-it -DexcludedGroups=.
      # Release packaging enables every JDBC driver used by version probes.
      - name: Build and test backend
        run: mvn -B -f backend/pom.xml -Pprobe-drivers clean verify

      - name: Verify probe drivers are packaged
        shell: bash
        run: |
          backend_jar="$(find backend/target -maxdepth 1 -type f -name 'env-dashboard-backend-*.jar' ! -name '*.original' -print -quit)"
          test -n "$backend_jar"
          jar tf "$backend_jar" | grep -Fx 'BOOT-INF/lib/DmJdbcDriver18-8.1.3.140.jar'
          jar tf "$backend_jar" | grep -Fx 'BOOT-INF/lib/oceanbase-client-2.4.7.1.jar'

      # `verify` runs through the package phase, so spring-boot-maven-plugin has
      # already repackaged the executable jar in backend/target/. Publish it so a
      # PR run yields a deployable backend (run with --spring.profiles.active=local
      # for an H2 try, or =prod against Oracle). The glob skips *.jar.original.
      - name: Upload backend jar
        uses: actions/upload-artifact@v7
        with:
          name: env-dashboard-backend-jar
          path: backend/target/env-dashboard-backend-*.jar
          if-no-files-found: error

  env-viewer-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.6'
          cache: true

      - name: Cache Flutter pub packages
        uses: actions/cache@v5
        with:
          path: .pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('apps/**/pubspec.lock', 'packages/**/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-flutter-pub-

      - name: Prepare env_viewer
        working-directory: apps/env_viewer
        run: |
          bash ../../scripts/sync_assets.sh
          flutter pub get

      - name: Analyze env_viewer
        working-directory: apps/env_viewer
        run: flutter analyze

      - name: Test env_viewer
        working-directory: apps/env_viewer
        run: |
          unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY ALL_PROXY all_proxy
          flutter test

      # The self-update helper is a pure-Dart package compiled per platform in
      # the build jobs; its swap/rollback logic is checked once here.
      - name: Analyze and test updater helper
        working-directory: apps/env_viewer/updater
        run: |
          dart pub get
          dart analyze
          dart test

  env-viewer-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.6'
          cache: true

      - name: Cache Flutter pub packages
        uses: actions/cache@v5
        with:
          path: .pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('apps/**/pubspec.lock', 'packages/**/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-flutter-pub-

      - name: Compute build metadata
        id: meta
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          VERSION=$(sed -n 's/^version: *\([0-9][0-9.]*\)+.*/\1/p' apps/env_viewer/pubspec.yaml)
          test -n "$VERSION"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # pubspec is the version source of truth; a release tag that disagrees
      # would ship a client that misidentifies itself to the update check.
      - name: Verify tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match pubspec version $VERSION" >&2
            exit 1
          fi

      - name: Build env_viewer
        working-directory: apps/env_viewer
        env:
          COMMIT: ${{ steps.meta.outputs.commit }}
          BUILD_TIME: ${{ steps.meta.outputs.build_time }}
        run: |
          bash ../../scripts/sync_assets.sh
          flutter pub get
          flutter build macos --release \
            --dart-define=COMMIT="$COMMIT" \
            --dart-define=BUILD_TIME="$BUILD_TIME"

      # Self-update swap/rollback helper (docs/client-update.md), compiled as a
      # standalone binary because the app cannot replace itself while running.
      - name: Bundle updater helper
        working-directory: apps/env_viewer/updater
        run: |
          dart pub get
          dart compile exe bin/env_viewer_updater.dart -o env_viewer_updater
          cp env_viewer_updater \
            "../build/macos/Build/Products/Release/env_viewer.app/Contents/Resources/env_viewer_updater"

      - name: Package
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          RELEASE_DIR="apps/env_viewer/build/macos/Build/Products/Release"
          APP="$RELEASE_DIR/env_viewer.app"
          rm -f "$APP/Contents/Resources/go_sidecar"
          rm -rf "$APP/Contents/Resources/jdbc"
          test ! -e "$APP/Contents/Resources/go_sidecar"
          test ! -e "$APP/Contents/Resources/jdbc"
          test -x "$APP/Contents/Resources/env_viewer_updater"
          (cd "$RELEASE_DIR" && zip -r -y "env_viewer-$VERSION-macos.zip" "env_viewer.app")

      - uses: actions/upload-artifact@v7
        with:
          name: env_viewer-macos
          path: apps/env_viewer/build/macos/Build/Products/Release/env_viewer-*-macos.zip
          if-no-files-found: error

  zipr-tool-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/zipr_tool/rust/target
            zipr/target
          key: macos-cargo-${{ hashFiles('zipr/Cargo.lock', 'apps/zipr_tool/rust/Cargo.lock') }}
          restore-keys: macos-cargo-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.6'
          cache: true

      - name: Cache Flutter pub packages
        uses: actions/cache@v5
        with:
          path: .pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('apps/**/pubspec.lock', 'packages/**/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-flutter-pub-

      - name: Compute build metadata
        id: meta
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"

      - name: Build zipr_tool
        working-directory: apps/zipr_tool
        env:
          COMMIT: ${{ steps.meta.outputs.commit }}
          BUILD_TIME: ${{ steps.meta.outputs.build_time }}
        run: |
          bash ../../scripts/sync_assets.sh
          flutter pub get
          flutter build macos --release \
            --dart-define=COMMIT="$COMMIT" \
            --dart-define=BUILD_TIME="$BUILD_TIME"

      - name: Package
        run: |
          RELEASE_DIR="apps/zipr_tool/build/macos/Build/Products/Release"
          (cd "$RELEASE_DIR" && zip -r -y "zipr_tool-macos.zip" "zipr_tool.app")

      - uses: actions/upload-artifact@v7
        with:
          name: zipr_tool-macos
          path: apps/zipr_tool/build/macos/Build/Products/Release/zipr_tool-macos.zip
          if-no-files-found: error

  env-viewer-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.6'
          cache: true

      - name: Cache Flutter pub packages
        uses: actions/cache@v5
        with:
          path: .pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('apps/**/pubspec.lock', 'packages/**/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-flutter-pub-

      - name: Compute build metadata
        id: meta
        shell: bash
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          VERSION=$(sed -n 's/^version: *\([0-9][0-9.]*\)+.*/\1/p' apps/env_viewer/pubspec.yaml)
          test -n "$VERSION"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # pubspec is the version source of truth; a release tag that disagrees
      # would ship a client that misidentifies itself to the update check.
      - name: Verify tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match pubspec version $VERSION" >&2
            exit 1
          fi

      - name: Build env_viewer
        working-directory: apps/env_viewer
        shell: bash
        env:
          COMMIT: ${{ steps.meta.outputs.commit }}
          BUILD_TIME: ${{ steps.meta.outputs.build_time }}
        run: |
          bash ../../scripts/sync_assets.sh
          flutter pub get
          flutter build windows --release \
            --dart-define=COMMIT="$COMMIT" \
            --dart-define=BUILD_TIME="$BUILD_TIME"

      # Self-update swap/rollback helper (docs/client-update.md), compiled as a
      # standalone binary because the app cannot replace itself while running.
      - name: Bundle updater helper
        working-directory: apps/env_viewer/updater
        shell: bash
        run: |
          dart pub get
          dart compile exe bin/env_viewer_updater.dart -o env_viewer_updater.exe
          cp env_viewer_updater.exe \
            "../build/windows/x64/runner/Release/env_viewer_updater.exe"

      - name: Package
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          RELEASE_DIR="apps/env_viewer/build/windows/x64/runner/Release"
          rm -f "$RELEASE_DIR/data/go_sidecar.exe"
          rm -rf "$RELEASE_DIR/data/jdbc"
          test ! -e "$RELEASE_DIR/data/go_sidecar.exe"
          test ! -e "$RELEASE_DIR/data/jdbc"
          test -e "$RELEASE_DIR/env_viewer_updater.exe"
          (cd "$RELEASE_DIR" && 7z a -tzip "../env_viewer-$VERSION-windows.zip" ./*)

      - uses: actions/upload-artifact@v7
        with:
          name: env_viewer-windows
          path: apps/env_viewer/build/windows/x64/runner/env_viewer-*-windows.zip
          if-no-files-found: error

  zipr-tool-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/zipr_tool/rust/target
            zipr/target
          key: windows-cargo-${{ hashFiles('zipr/Cargo.lock', 'apps/zipr_tool/rust/Cargo.lock') }}
          restore-keys: windows-cargo-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.6'
          cache: true

      - name: Cache Flutter pub packages
        uses: actions/cache@v5
        with:
          path: .pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('apps/**/pubspec.lock', 'packages/**/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-flutter-pub-

      - name: Compute build metadata
        id: meta
        shell: bash
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"

      - name: Build zipr_tool
        working-directory: apps/zipr_tool
        shell: bash
        env:
          COMMIT: ${{ steps.meta.outputs.commit }}
          BUILD_TIME: ${{ steps.meta.outputs.build_time }}
        run: |
          bash ../../scripts/sync_assets.sh
          flutter pub get
          flutter build windows --release \
            --dart-define=COMMIT="$COMMIT" \
            --dart-define=BUILD_TIME="$BUILD_TIME"

      - name: Package
        shell: bash
        run: |
          RELEASE_DIR="apps/zipr_tool/build/windows/x64/runner/Release"
          (cd "$RELEASE_DIR" && 7z a -tzip "../zipr_tool-windows.zip" ./*)

      - uses: actions/upload-artifact@v7
        with:
          name: zipr_tool-windows
          path: apps/zipr_tool/build/windows/x64/runner/zipr_tool-windows.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, env-viewer-checks, env-viewer-macos, zipr-tool-macos, env-viewer-windows, zipr-tool-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checkout only to pick up the optional checked-in release notes.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Optional Chinese release notes: docs/releases/<version>.md, attached
      # under the sidecar name the backend updates directory expects, so
      # publish_update.sh can copy it verbatim. Absent file = release without notes.
      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.zip" -o -name "env-dashboard-backend-*.jar" \) -exec cp {} release/ \;
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -f "docs/releases/$VERSION.md" ]; then
            cp "docs/releases/$VERSION.md" "release/env_viewer-$VERSION.notes.md"
          fi
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release/*
          fail_on_unmatched_files: true
