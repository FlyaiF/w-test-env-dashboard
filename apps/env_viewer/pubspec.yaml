name: env_viewer
description: "测试环境速查工具"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  cupertino_icons: ^1.0.8
  dartssh2: ^2.9.0
  fast_gbk: ^1.0.0
  file_selector: ^1.0.3
  http: ^1.3.0
  provider: ^6.1.0
  window_manager: ^0.5.1
  url_launcher: ^6.3.0
  intl: ^0.20.0
  package_info_plus: ^9.0.1
  shared_ui:
    path: ../../packages/shared_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.30.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: Sarasa Gothic SC
      fonts:
        - asset: assets/fonts/SarasaGothicSC-Regular.ttf
        - asset: assets/fonts/SarasaGothicSC-Bold.ttf
          weight: 700
    - family: Sarasa Mono SC
      fonts:
        - asset: assets/fonts/SarasaMonoSC-Regular.ttf
        - asset: assets/fonts/SarasaMonoSC-Bold.ttf
          weight: 700
